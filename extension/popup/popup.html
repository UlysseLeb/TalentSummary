<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>TalentSummary</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">🎯</span>
    <h1>TalentSummary</h1>
    <p class="tagline">v1.0.0 — Aide à la décision recrutement</p>
  </div>

  <div class="state" style="text-align:center; padding: 32px 20px;">
    <div style="font-size:48px; margin-bottom:16px;">🎙️</div>
    <p style="font-size:15px; font-weight:600; color:#334155; margin-bottom:8px;">
      Prêt à analyser un entretien
    </p>
    <p style="font-size:12px; color:#94a3b8; margin-bottom:24px;">
      Un onglet s'ouvrira pour l'enregistrement
    </p>
    <button id="btn-open" class="btn btn-record" style="width:100%; font-size:15px; padding:14px;">
      ⏺ Démarrer l'enregistrement
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
